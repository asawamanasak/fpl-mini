name: FPL Mini-League Auto Sync & Deploy

on:
  schedule:
    # รันอัตโนมัติทุก 15 นาที ในนาทีที่ไม่ชนรอบกลมทั่วโลก (3, 18, 33, 48) ควบคู่กับ Cloudflare Edge Live Relay
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch: # ปุ่มกดสั่งรันเองได้ตลอดเวลาในแท็บ Actions บน GitHub
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fpl-sync-deploy
  cancel-in-progress: false

jobs:
  sync-and-build:
    name: Sync Live Data & Build Distribution
    runs-on: ubuntu-latest

    steps:
      - name: Stagger Schedule Offset (58s Delay)
        if: github.event_name == 'schedule'
        run: |
          echo "Staggering run by 58 seconds to avoid global top-of-minute congestion..."
          sleep 58

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Real-Time FPL Data
        env:
          AZURE_TRANSFER_FUNCTION_KEY: ${{ secrets.AZURE_TRANSFER_FUNCTION_KEY }}
        run: |
          python3 sync_live_fpl.py

      - name: Build Dashboard & Static Site Bundle
        run: |
          python3 update_preview.py

      - name: Commit and Push Data Updates
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Stage only data cache and season archives (HTML is deployed via artifact)
          git add multi_fpl_data.json real_fpl_40700_data.json seasons/ config/managers.json
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "Auto-sync live FPL data [skip ci]"
            if ! git pull --rebase origin main; then
              echo "Notice: Rebase conflict detected. Preserving fresh sync JSON and re-generating on top of origin/main..."
              git rebase --abort || true
              cp multi_fpl_data.json /tmp/multi_fpl_data.json.fresh
              cp real_fpl_40700_data.json /tmp/real_fpl_40700_data.json.fresh
              git fetch origin main
              git reset --hard origin/main
              mv /tmp/multi_fpl_data.json.fresh multi_fpl_data.json
              mv /tmp/real_fpl_40700_data.json.fresh real_fpl_40700_data.json
              python3 update_preview.py
              git add multi_fpl_data.json real_fpl_40700_data.json seasons/ config/managers.json
              if ! git diff --staged --quiet; then
                git commit -m "Auto-sync live FPL data [skip ci]"
              fi
            fi
            git push origin main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    name: Deploy to GitHub Pages
    needs: sync-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

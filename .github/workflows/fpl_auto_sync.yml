name: FPL Mini-League Auto Sync

on:
  schedule:
    # รันอัตโนมัติทุกๆ 20 นาที
    - cron: '*/20 * * * *'
  workflow_dispatch: # ปุ่มกดสั่งรันเองได้ตลอดเวลาในแท็บ Actions บน GitHub

permissions:
  contents: write

jobs:
  sync-fpl-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Real-Time FPL Data
        run: |
          python3 sync_live_fpl.py

      - name: Regenerate Dashboard Presentation
        run: |
          python3 update_preview.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add real_fpl_40700_data.json index.html preview.html
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "Auto-sync live FPL data [skip ci]"
            git push
          fi

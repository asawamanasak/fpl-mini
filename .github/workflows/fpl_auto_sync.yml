name: FPLSaWaDiKa Auto Sync

on:
  schedule:
    # Smart Dual-Cadence Sync (ลดภาระระบบลง 83% และไม่กระทบ FPL Rate Limit):
    # 1. วันแข่ง & เดดไลน์ (ศุกร์, เสาร์, อาทิตย์, จันทร์): ซิงก์ทุก 1 ชั่วโมง ในนาทีที่ 18
    - cron: '18 * * * 5,6,0,1'
    # 2. วันธรรมดาไม่มีแข่ง (อังคาร, พุธ, พฤหัสบดี): ซิงก์ทุก 4 ชั่วโมง ในนาทีที่ 18
    - cron: '18 */4 * * 2,3,4'
  workflow_dispatch: # ปุ่มกดสั่งรันเองได้ตลอดเวลาในแท็บ Actions บน GitHub

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fpl-sync
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Stagger Schedule Offset (58s Delay)
        if: github.event_name == 'schedule'
        run: |
          echo "Staggering run by 58 seconds to avoid global top-of-minute congestion..."
          sleep 58

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Real-Time FPL Data
        env:
          AZURE_TRANSFER_FUNCTION_KEY: ${{ secrets.AZURE_TRANSFER_FUNCTION_KEY }}
        run: |
          python3 sync_live_fpl.py

      - name: Regenerate Dashboard Presentation
        run: |
          python3 update_preview.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "Auto-sync live FPL data [skip ci]"
            if ! git pull --rebase origin main; then
              echo "Notice: Rebase conflict detected. Preserving fresh sync JSON and re-generating on top of origin/main..."
              git rebase --abort || true
              cp multi_fpl_data.json /tmp/multi_fpl_data.json.fresh
              git fetch origin main
              git reset --hard origin/main
              mv /tmp/multi_fpl_data.json.fresh multi_fpl_data.json
              python3 update_preview.py
              git add -A
              if ! git diff --staged --quiet; then
                git commit -m "Auto-sync live FPL data [skip ci]"
              fi
            fi
            git push origin main
          fi

      - name: Stage Public Pages Artifact
        run: |
          rm -rf _site
          mkdir -p _site
          for f in .nojekyll CNAME favicon.ico robots.txt sitemap.xml site.webmanifest index.html 404.html; do
            if [ -f "$f" ]; then
              cp "$f" _site/
            fi
          done
          for d in assets data docs fonts images; do
            if [ -d "$d" ]; then
              cp -R "$d" _site/
            fi
          done
          for d in [0-9]*/; do
            d_clean="${d%/}"
            if [ -d "$d_clean" ]; then
              cp -R "$d_clean" _site/
            fi
          done
          test -f _site/index.html
          if [ -e _site/workers ] || [ -e _site/config ]; then
            echo "Error: Private directories leaked into _site!" >&2
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

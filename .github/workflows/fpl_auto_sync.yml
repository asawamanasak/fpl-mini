name: FPL Mini-League Auto Sync

on:
  schedule:
    # รันอัตโนมัติทุก 15 นาที ในนาทีที่ไม่ชนรอบกลมทั่วโลก (3, 18, 33, 48) ควบคู่กับ Cloudflare Edge Live Relay
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch: # ปุ่มกดสั่งรันเองได้ตลอดเวลาในแท็บ Actions บน GitHub

permissions:
  contents: write

concurrency:
  group: fpl-sync
  cancel-in-progress: true

jobs:
  sync-fpl-data:
    runs-on: ubuntu-latest

    steps:
      - name: Stagger Schedule Offset (58s Delay)
        if: github.event_name == 'schedule'
        run: |
          echo "Staggering run by 58 seconds to avoid global top-of-minute congestion..."
          sleep 58

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Real-Time FPL Data
        env:
          AZURE_TRANSFER_FUNCTION_KEY: ${{ secrets.AZURE_TRANSFER_FUNCTION_KEY || 'db059d47-8b44-476a-9dfc-509bceb87bee' }}
        run: |
          python3 sync_live_fpl.py

      - name: Regenerate Dashboard Presentation
        run: |
          python3 update_preview.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "Auto-sync live FPL data [skip ci]"
            if ! git pull --rebase origin main; then
              echo "Notice: Rebase conflict detected. Preserving fresh sync JSON and re-generating on top of origin/main..."
              git rebase --abort || true
              cp multi_fpl_data.json /tmp/multi_fpl_data.json.fresh
              cp real_fpl_40700_data.json /tmp/real_fpl_40700_data.json.fresh
              git fetch origin main
              git reset --hard origin/main
              mv /tmp/multi_fpl_data.json.fresh multi_fpl_data.json
              mv /tmp/real_fpl_40700_data.json.fresh real_fpl_40700_data.json
              python3 update_preview.py
              git add -A
              if ! git diff --staged --quiet; then
                git commit -m "Auto-sync live FPL data [skip ci]"
              fi
            fi
            git push origin main
          fi

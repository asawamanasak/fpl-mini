name: FPLSaWaDiKa Auto Sync

on:
  schedule:
    # Smart Dual-Cadence Sync (ลดภาระระบบลง 83% และไม่กระทบ FPL Rate Limit):
    # 1. วันแข่ง & เดดไลน์ (ศุกร์, เสาร์, อาทิตย์, จันทร์): ซิงก์ทุก 1 ชั่วโมง ในนาทีที่ 18
    - cron: '18 * * * 5,6,0,1'
    # 2. วันธรรมดาไม่มีแข่ง (อังคาร, พุธ, พฤหัสบดี): ซิงก์ทุก 4 ชั่วโมง ในนาทีที่ 18
    - cron: '18 */4 * * 2,3,4'
  workflow_dispatch: # ปุ่มกดสั่งรันเองได้ตลอดเวลาในแท็บ Actions บน GitHub

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry2.outputs.page_url || steps.deployment_retry1.outputs.page_url || steps.deployment.outputs.page_url }}

    steps:
      - name: Stagger Schedule Offset (58s Delay)
        if: github.event_name == 'schedule'
        run: |
          echo "Staggering run by 58 seconds to avoid global top-of-minute congestion..."
          sleep 58

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Fetch Real-Time FPL Data
        env:
          AZURE_TRANSFER_FUNCTION_KEY: ${{ secrets.AZURE_TRANSFER_FUNCTION_KEY }}
        run: |
          python3 sync_live_fpl.py

      - name: Check If Sync Changed Data
        id: sync_check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -n "$(git status --porcelain -- multi_fpl_data.json data/players.json data/leagues/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Live data or manual dispatch triggered rebuild & Pages deploy."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No live score changes detected; skipping Node setup, rebuild, commit, and Pages deploy."
          fi

      - name: Setup Node.js
        if: steps.sync_check.outputs.changed == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Build Tooling
        if: steps.sync_check.outputs.changed == 'true'
        run: npm ci

      - name: Regenerate Dashboard Presentation
        if: steps.sync_check.outputs.changed == 'true'
        run: |
          python3 update_preview.py

      - name: Commit and Push Updates
        if: steps.sync_check.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "Auto-sync live FPL data [skip ci]"
            if ! git pull --rebase origin main; then
              echo "Notice: Rebase conflict detected. Preserving fresh sync JSON and re-generating on top of origin/main..."
              git rebase --abort || true
              cp multi_fpl_data.json /tmp/multi_fpl_data.json.fresh
              if [ -f data/players.json ]; then
                cp data/players.json /tmp/players.json.fresh
              fi
              git fetch origin main
              git reset --hard origin/main
              mv /tmp/multi_fpl_data.json.fresh multi_fpl_data.json
              if [ -f /tmp/players.json.fresh ]; then
                mkdir -p data
                mv /tmp/players.json.fresh data/players.json
              fi
              python3 update_preview.py
              git add -A
              if ! git diff --staged --quiet; then
                git commit -m "Auto-sync live FPL data [skip ci]"
              fi
            fi
            git push origin main
          fi

      - name: Stage Public Pages Artifact
        if: steps.sync_check.outputs.changed == 'true'
        run: |
          rm -rf _site
          mkdir -p _site
          for f in .nojekyll CNAME favicon.ico robots.txt sitemap.xml site.webmanifest index.html preview.html 404.html; do
            if [ -f "$f" ]; then
              cp "$f" _site/
            fi
          done
          for d in assets data docs fonts images pay; do
            if [ -d "$d" ]; then
              cp -R "$d" _site/
            fi
          done
          for d in [0-9]*/; do
            d_clean="${d%/}"
            if [ -d "$d_clean" ]; then
              cp -R "$d_clean" _site/
            fi
          done
          find _site -name '*.bak' -type f -delete
          test -f _site/index.html
          if [ -e _site/workers ] || [ -e _site/config ]; then
            echo "Error: Private directories leaked into _site!" >&2
            exit 1
          fi

      - name: Setup Pages
        if: steps.sync_check.outputs.changed == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: steps.sync_check.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '_site'

      # GitHub บางครั้งยังจัดดัชนี artifact ไม่เสร็จทันที ทำให้ deploy-pages หาไฟล์ไม่เจอ
      # ("No artifacts named github-pages"). จึง retry 2 ครั้ง (รอ 30 วิ / 60 วิ)
      # ก่อนยอมแพ้ — ถ้าล้มทั้ง 3 ครั้งจะยังแจ้ง Error ตามเดิม
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.sync_check.outputs.changed == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Wait before Deploy Retry 1 (30s)
        if: steps.sync_check.outputs.changed == 'true' && steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (Retry 1)
        id: deployment_retry1
        if: steps.sync_check.outputs.changed == 'true' && steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Wait before Deploy Retry 2 (60s)
        if: steps.sync_check.outputs.changed == 'true' && steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (Retry 2, final)
        id: deployment_retry2
        if: steps.sync_check.outputs.changed == 'true' && steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

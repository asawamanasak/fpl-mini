name: FPL Mini-League Auto Sync

on:
  schedule:
    # รันอัตโนมัติทุก 20 นาที (ใช้นาทีที่ไม่ชนหัวชั่วโมงเพื่อลดปัญหาคิว GitHub Actions ดีเลย์)
    - cron: '7,27,47 * * * *'
  workflow_dispatch: # ปุ่มกดสั่งรันเองได้ตลอดเวลาในแท็บ Actions บน GitHub

permissions:
  contents: write

concurrency:
  group: fpl-sync
  cancel-in-progress: true

jobs:
  sync-fpl-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Real-Time FPL Data
        env:
          AZURE_TRANSFER_FUNCTION_KEY: ${{ secrets.AZURE_TRANSFER_FUNCTION_KEY || 'db059d47-8b44-476a-9dfc-509bceb87bee' }}
        run: |
          python3 sync_live_fpl.py

      - name: Regenerate Dashboard Presentation
        run: |
          python3 update_preview.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "Auto-sync live FPL data [skip ci]"
            git pull --rebase origin main
            git push
          fi

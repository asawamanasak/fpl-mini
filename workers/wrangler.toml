name = "fpl-live-relay"
main = "fpl-live-worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Cloudflare KV Storage Binding
[[kv_namespaces]]
binding = "ANALYTICS_KV"
id = "a582535614b9489ebd626534ba6c0da1"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "fpl-database"
database_id = "b37459ac-6632-4db5-8afa-822b76b26184"

# Cloudflare Zero Trust (Access) Public Verification Metadata
[vars]
CF_ACCESS_TEAM_DOMAIN = "super-water-8a1d.cloudflareaccess.com"
CF_ACCESS_AUD = "f4e1047763eabc94f95f0741d46c804786bf657f1fbe8b5c034ac3a851ccc4f8"

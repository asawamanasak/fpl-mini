name = "fpl-live-relay"
main = "fpl-live-worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.05

[vars]
ENVIRONMENT = "production"
GITHUB_BRANCH = "main"
CF_ACCESS_TEAM_DOMAIN = "super-water-8a1d.cloudflareaccess.com"
CF_ACCESS_AUD = "f4e1047763eabc94f95f0741d46c804786bf657f1fbe8b5c034ac3a851ccc4f8"

# Cloudflare KV Storage Binding (Production)
[[kv_namespaces]]
binding = "ANALYTICS_KV"
id = "a582535614b9489ebd626534ba6c0da1"

# Cloudflare D1 Database Binding (Production)
[[d1_databases]]
binding = "DB"
database_name = "fpl-database"
database_id = "b37459ac-6632-4db5-8afa-822b76b26184"

# ==========================================================
# Isolated Staging Environment (Local Dev & Commercial QA)
# Use: `npx wrangler dev --local --env staging --port 8787`
# Remote deploy (only when ready): `npx wrangler deploy --env staging`
# ==========================================================
[env.staging]
name = "fpl-live-relay-staging"
workers_dev = true

[env.staging.observability]
enabled = true

[env.staging.observability.logs]
enabled = true
head_sampling_rate = 1

[env.staging.observability.traces]
enabled = true
head_sampling_rate = 0.05

[env.staging.vars]
ENVIRONMENT = "staging"
GITHUB_BRANCH = "main"
CF_ACCESS_TEAM_DOMAIN = "super-water-8a1d.cloudflareaccess.com"
CF_ACCESS_AUD = "f4e1047763eabc94f95f0741d46c804786bf657f1fbe8b5c034ac3a851ccc4f8"

# Local emulation binds automatically with --local.
# Before remote deploy (--env staging), replace placeholder IDs with `wrangler kv namespace create` & `wrangler d1 create fpl-database-staging`.
[[env.staging.kv_namespaces]]
binding = "ANALYTICS_KV"
id = "00000000000000000000000000000001"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "fpl-database-staging"
database_id = "00000000-0000-0000-0000-000000000000"
